<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Grok Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="wallpaper" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="window" id="app">
    <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>

    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <div class="sb-inner">
        <div class="sb-top"></div>
        <button class="search" id="searchBtn" type="button">
          <span class="search-ic"></span><span>Search</span><kbd id="kbd">⌘K</kbd>
        </button>
        <div class="segmented" id="segmented" role="tablist" aria-label="View">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button role="tab" type="button" data-view="team">Team</button>
          <button role="tab" type="button" data-view="rooms">Rooms</button>
        </div>
        <div class="sb-scroll" id="side"></div>
        <div class="sb-foot">
          <label class="me-row" for="nameInput">
            <span id="meAvatar"></span>
            <input id="nameInput" maxlength="24" placeholder="Your name" autocomplete="off" />
          </label>
          <div class="model" id="health" data-state="pending"><i></i><span id="healthText">Connecting to model…</span></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="toolbar">
        <button class="icon-btn" id="sidebarBtn" type="button" aria-label="Toggle sidebar" title="Toggle sidebar"></button>
        <div class="titles">
          <h1 id="title">Team</h1>
          <p id="subtitle"></p>
        </div>
        <div class="tb-actions" id="headActions"></div>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Appearance"></button>
        <button class="icon-btn" id="inspectorBtn" type="button" aria-label="Toggle activity panel" title="Activity panel"></button>
      </header>

      <div class="banner" id="banner" hidden></div>

      <section class="thread" id="teamThread" aria-live="polite"></section>
      <section class="thread" id="roomThread" aria-live="polite" hidden></section>
      <button class="jump" id="jumpBtn" type="button" aria-label="Scroll to latest" hidden></button>

      <form class="composer" id="composer" autocomplete="off">
        <div class="popover" id="mentionPop" role="listbox" hidden></div>
        <div class="to-row" id="targets"></div>
        <div class="input-row">
          <button type="button" class="mention-btn" id="mentionBtn" aria-label="Mention a teammate" title="Mention a teammate"></button>
          <textarea id="input" rows="1" placeholder="Message the team" aria-label="Message"></textarea>
          <button type="submit" class="send" id="sendBtn" aria-label="Send"></button>
        </div>
      </form>
    </main>

    <aside class="inspector" id="inspector" aria-label="Activity">
      <div class="ins-inner">
        <div class="ins-head"><h2>Activity</h2><span id="insStatus"></span></div>
        <div class="ins-body" id="insBody"></div>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="palette" id="palette" hidden>
    <div class="palette-box" role="dialog" aria-label="Command palette">
      <div class="palette-search"><span class="search-ic"></span><input id="paletteInput" placeholder="Search actions, agents, skills and rooms" autocomplete="off" /></div>
      <div class="palette-list" id="paletteList" role="listbox"></div>
      <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> to move</span><span><kbd>↵</kbd> to open</span><span><kbd>esc</kbd> to close</span></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/script.js"></script>
</body>
</html>
