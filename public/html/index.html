<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Grok Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;650&family=Geist+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app" id="app">
    <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
    <nav class="rail" aria-label="Views">
      <div class="mark" aria-hidden="true">G</div>
      <button class="rail-btn" data-view="team" aria-label="Team" title="Team">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.6-3 2.7-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/><circle cx="17" cy="9" r="2.2"/><path d="M16.5 14.6c2.3.1 3.7 1.4 4.2 3.9"/></svg>
      </button>
      <button class="rail-btn" data-view="rooms" aria-label="Rooms" title="Rooms">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16v10H10l-4 3.5v-3.5H4z"/></svg>
      </button>
      <span class="grow"></span>
      <span class="health" id="health" role="status" aria-live="polite"><i></i></span>
    </nav>

    <aside class="side" id="side" aria-label="Context"></aside>

    <main class="stage">
      <header class="stage-head">
        <button class="menu-btn" id="menuBtn" aria-label="Toggle panel">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="titles">
          <h1 id="title">Team</h1>
          <p id="subtitle"></p>
        </div>
        <div class="head-actions" id="headActions"></div>
      </header>

      <div class="banner" id="banner" hidden></div>

      <section class="thread" id="teamThread" aria-live="polite"></section>
      <section class="thread" id="roomThread" aria-live="polite" hidden></section>

      <form class="composer" id="composer" autocomplete="off">
        <div class="targets" id="targets"></div>
        <div class="input-row">
          <textarea id="input" rows="1" placeholder="Message the team" aria-label="Message"></textarea>
          <button type="submit" class="send" id="sendBtn" aria-label="Send"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
        </div>
      </form>
    </main>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/script.js"></script>
</body>
</html>
